name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 188.213.171.208
          port: 22
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 60s
          script: |
            set -e
            echo "--- Ricerca app ---"
            APP_DIR=$(find /home /root /var/www -name "package.json" -path "*/preventivo*" 2>/dev/null | head -1 | xargs dirname)
            echo "App trovata in: $APP_DIR"
            cd "$APP_DIR"
            echo "--- Commit prima del pull ---"
            git log -1 --oneline
            git stash
            git pull origin main
            npm install --production --silent
            echo "--- Stato PM2 su tutti gli utenti ---"
            ps aux | grep pm2 | grep -v grep
            APP_USER=$(ps aux | grep pm2 | grep -v grep | awk '{print $1}' | head -1)
            echo "PM2 utente: $APP_USER"
            if [ -n "$APP_USER" ] && [ "$APP_USER" != "root" ]; then
              su - "$APP_USER" -c "pm2 restart preventivo-easy && pm2 save"
            else
              pm2 restart preventivo-easy 2>/dev/null || \
                pm2 start "$APP_DIR/src/index.js" --name preventivo-easy
              pm2 save
            fi
            echo "--- Commit dopo il pull ---"
            git log -1 --oneline
            echo "--- Deploy completato ---"
