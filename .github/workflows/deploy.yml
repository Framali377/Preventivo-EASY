name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 188.213.171.208
          port: 22
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 120s
          script: |
            set -e
            APP_DIR="/home/appuser/preventivo-easy"
            echo "=== App dir: $APP_DIR ==="
            cd "$APP_DIR"

            echo "=== Git pull ==="
            git log -1 --oneline
            git stash
            git pull origin main
            git log -1 --oneline

            echo "=== npm install ==="
            npm install --production

            echo "=== PM2 restart ==="
            su - appuser -c "pm2 restart preventivo-easy && pm2 save"
            sleep 4

            echo "=== PM2 logs ==="
            su - appuser -c "pm2 logs preventivo-easy --lines 15 --nostream"

            echo "=== Deploy completato ==="
