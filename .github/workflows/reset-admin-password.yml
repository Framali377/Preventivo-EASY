name: Reset Admin Password (one-shot)

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 188.213.171.208
          port: 22
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          timeout: 60s
          script: |
            set -e
            APP_DIR="/home/appuser/preventivo-easy"
            cd "$APP_DIR"
            node -e "
              const bcrypt = require('bcrypt');
              const { getDb } = require('./src/utils/db');
              bcrypt.hash('4d8b4bb89553', 10).then(hash => {
                const db = getDb();
                const result = db.prepare(
                  \"UPDATE users SET password_hash = ? WHERE email = 'francesco.malitesta@gmail.com'\"
                ).run(hash);
                if (result.changes === 0) {
                  console.log('ERRORE: utente non trovato');
                  process.exit(1);
                }
                console.log('Password aggiornata con successo');
              });
            "
